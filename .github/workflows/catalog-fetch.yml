# Veliq 作品目録の元データ（IMSLP・Wikidata）を取り込み、catalog-src ブランチに保存する
name: catalog-fetch
on:
  push:
    branches: [catalog-src]
    paths: [".github/workflows/catalog-fetch.yml", "tools/catalog_fetch.py", "tools/catalog_fetch.only"]
  workflow_dispatch:
  schedule:
    - cron: "17 18 1 * *"   # 毎月1日 03:17（日本時間）
permissions:
  contents: write
concurrency:
  group: catalog-fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: fetch
        run: |
          if [ -f tools/catalog_fetch.only ]; then export ONLY="$(cat tools/catalog_fetch.only)"; fi
          python3 tools/catalog_fetch.py
      - name: save
        if: always()
        run: |
          git config user.name "veliq-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data-src/catalog/raw
          git commit -m "catalog-src: $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          git pull --rebase origin catalog-src || true
          git push origin HEAD:catalog-src
